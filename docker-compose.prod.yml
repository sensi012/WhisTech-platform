# Production override
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:

  api:
    image: ${ECR_REGISTRY}/whistech/api:${IMAGE_TAG:?IMAGE_TAG is required}
    build: !reset null
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.75'
          memory: 384M
        reservations:
          cpus: '0.25'
          memory: 192M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  frontend:
    image: ${ECR_REGISTRY}/whistech/frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    build: !reset null
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M

  db:
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 256M

  nginx:
    ports:
      - "80:80"
      - "443:443"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
