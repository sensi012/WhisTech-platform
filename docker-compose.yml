services:

  db:
    image: postgres:16.3-alpine3.20
    environment:
      POSTGRES_DB:       ${DB_NAME:-whistech}
      POSTGRES_USER:     ${DB_USER:-whistech}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-whistech} -d ${DB_NAME:-whistech}"]
      interval: 10s
      timeout:  5s
      retries:  5
      start_period: 20s
    restart: unless-stopped
    networks:
      - backend

  api:
    build:
      context: ./services/api
      target:  production
    environment:
      NODE_ENV:    production
      PORT:        3000
      DB_HOST:     db
      DB_PORT:     5432
      DB_NAME:     ${DB_NAME:-whistech}
      DB_USER:     ${DB_USER:-whistech}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      LOG_LEVEL:   ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout:  10s
      retries:  3
      start_period: 40s
    restart: unless-stopped
    networks:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          cpus:   '0.5'
          memory: 256M
        reservations:
          memory: 128M

  frontend:
    build:
      context: ./services/frontend
      target:  production
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 30s
      timeout:  5s
      retries:  3
      start_period: 10s
    restart: unless-stopped
    networks:
      - frontend
    deploy:
      resources:
        limits:
          cpus:   '0.25'
          memory: 64M

  nginx:
    image: nginx:1.27.0-alpine3.19
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - frontend

volumes:
  db_data:
    driver: local

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
