name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:

  test-api:
    name: Test API
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.3-alpine3.20
        env:
          POSTGRES_DB:       whistech_test
          POSTGRES_USER:     whistech
          POSTGRES_PASSWORD: testpassword
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/api/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: services/api

      - name: Run integration tests
        run: npm test
        working-directory: services/api
        env:
          DB_HOST:     localhost
          DB_PORT:     5432
          DB_NAME:     whistech_test
          DB_USER:     whistech
          DB_PASSWORD: testpassword
          NODE_ENV:    test

  build-and-scan:
    name: Build + Trivy scan
    runs-on: ubuntu-latest
    needs: test-api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context:    ./services/api
          target:     production
          load:       true
          tags:       whistech/api:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Scan API image — fail on HIGH or CRITICAL CVEs
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref:  whistech/api:${{ github.sha }}
          format:     sarif
          output:     trivy-api.sarif
          severity:   HIGH,CRITICAL
          exit-code:  '1'

      - name: Upload scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-api.sarif

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context:    ./services/frontend
          target:     production
          load:       true
          tags:       whistech/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref:  whistech/frontend:${{ github.sha }}
          severity:   HIGH,CRITICAL
          exit-code:  '1'
          format:     table
